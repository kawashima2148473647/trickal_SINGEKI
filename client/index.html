<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
</head>
<body>
  <h1>ロビー</h1>

  <button id="createBtn">部屋を作成</button>
  <br><br>

  <input id="roomIdInput" placeholder="部屋IDを入力">
  <button id="joinBtn">部屋に参加</button>

  <pre id="log"></pre>

  <script>
    const log = msg => {
      document.getElementById("log").textContent += msg + "\n";
    };

    const ws = new WebSocket("wss://trickal-singeki.onrender.com");

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === "roomCreated") {
        // 部屋ページへ移動
        location.href = `room.html?roomId=${msg.roomId}`;
      }

      if (msg.type === "playerJoined") {
        log("誰かが参加した: " + msg.playerId);
      }
    };

    document.getElementById("createBtn").onclick = () => {
      ws.send(JSON.stringify({ type: "createRoom" }));
    };

    document.getElementById("joinBtn").onclick = () => {
      const roomId = Number(document.getElementById("roomIdInput").value);
      ws.send(JSON.stringify({ type: "joinRoom", roomId }));
      location.href = `room.html?roomId=${roomId}`;
    };
  </script>
</body>
</html>
