<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カードゲーム - 入室</title>
</head>
<body>
  <h1>カードゲーム</h1>
  <label>
    名前：
    <input type="text" id="nameInput" />
  </label>
  <button id="enterBtn">入室</button>

  <script>
    document.getElementById('enterBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('名前を入力してください');
        return;
      }
      // 名前をクエリに付けてroom.htmlへ
      location.href = `room.html?name=${encodeURIComponent(name)}`;
    });
  </script>
</body>
</html>
