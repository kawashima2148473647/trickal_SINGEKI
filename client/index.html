<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lobby</title>
</head>
<body>
  <h1>ロビー</h1>

  <input id="playerName" placeholder="名前を入力">
  <br><br>

  <input id="roomNameInput" placeholder="部屋名を入力">
  <br><br>

  <button id="createBtn">部屋を作成</button>
  <br><br>
  
  <button id="joinBtn">部屋に参加</button>

  <pre id="log"></pre>

  <script>
    const nameInput = document.getElementById("playerName");
    const createBtn = document.getElementById("createBtn");
    const joinBtn = document.getElementById("joinBtn");

    nameInput.addEventListener("input", () => {
      const ok = nameInput.value.trim().length > 0;		
      createBtn.disabled = !ok;
      joinBtn.disabled = !ok;
    });

    const log = msg => {
      document.getElementById("log").textContent += msg + "\n";
    };

    const ws = new WebSocket("wss://trickal-singeki.onrender.com");

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

    if (msg.type === "roomCreated") {
      location.href = `room.html?roomName=${encodeURIComponent(msg.roomName)}`;
    }

      if (msg.type === "playerJoined") {
        log("誰かが参加した: " + msg.playerId);
      }
    };

    createBtn.onclick = () => {
      const playerName = nameInput.value.trim();
      const roomName = document.getElementById("roomNameInput").value.trim();

      if (!playerName) {
        alert("名前を入力してください");
        return;
      }

      if (!roomName) {
        alert("部屋名を入力してください");
        return;
      }

      localStorage.setItem("playerName", playerName);

      ws.send(JSON.stringify({
        type: "createRoom",
        roomName
      }));
    };

    joinBtn.onclick = () => {
      const playerName = nameInput.value.trim();
      const roomName = document.getElementById("roomNameInput").value.trim();

      if (!playerName) {
        alert("名前を入力してください");
        return;
      }

      if (!roomName) {
        alert("部屋名を入力してください");
        return;
      }

      localStorage.setItem("playerName", playerName);

      location.href = `room.html?roomName=${encodeURIComponent(roomName)}`;
    };
  </script>
</body>
</html>
