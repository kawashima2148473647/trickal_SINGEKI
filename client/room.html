<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Room</title>
</head>
<body>
  <h1>部屋ページ</h1>

  <h2>部屋番号: <span id="roomNumber"></span></h2>

  <h2>プレイヤー一覧</h2>
  <ul id="players"></ul>

  <button id="leaveBtn">退出する</button>

  <script>
    const params = new URLSearchParams(location.search);
    const roomName = params.get("roomName");

    document.getElementById("roomNumber").textContent = roomName;

    const playerName = localStorage.getItem("playerName");

    const ws = new WebSocket("wss://trickal-singeki.onrender.com");

    const playersEl = document.getElementById("players");

    // 名前を取得
    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "joinRoom",
        roomName,
        name: playerName
      }));
    };

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === "playerList") {
        playersEl.innerHTML = "";
        msg.players.forEach(p => {
          const li = document.createElement("li");
          li.textContent = p.name;
          playersEl.appendChild(li);
        });
      }

      if (msg.type === "playerJoined") {
        const li = document.createElement("li");
        li.textContent = msg.name;
        playersEl.appendChild(li);
      }
    };

    document.getElementById("leaveBtn").onclick = () => {
      ws.send(JSON.stringify({ type: "leaveRoom", roomName }));
      location.href = "index.html";
    };
  </script>
</body>
</html>
