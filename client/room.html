<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カードゲーム - ルーム</title>
</head>
<body>
  <h1>ルーム</h1>
  <div>
    あなたの名前：<span id="myName"></span>
  </div>
  <h2>参加者一覧</h2>
  <ul id="playerList"></ul>

  <button id="startGameBtn">ゲーム開始</button>

  <script>
    const params = new URLSearchParams(location.search);
    const myName = params.get('name');
    if (!myName) {
      alert('名前情報がありません。トップに戻ります。');
      location.href = 'index.html';
    }
    document.getElementById('myName').textContent = myName;

    const ws = new WebSocket(`ws://${location.host}`);

    let myId = null;

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({
        type: 'join_room',
        name: myName
      }));
    });

    ws.addEventListener('message', (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'room_state') {
        renderPlayers(msg.players);
      }

      if (msg.type === 'assign_id') {
        myId = msg.id;
      }

      if (msg.type === 'game_start') {
        // 全員game.htmlへ遷移
        location.href = `game.html?name=${encodeURIComponent(myName)}&id=${encodeURIComponent(myId)}`;
      }
    });

    function renderPlayers(players) {
      const ul = document.getElementById('playerList');
      ul.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.name;
        ul.appendChild(li);
      });
    }

    document.getElementById('startGameBtn').addEventListener('click', () => {
      ws.send(JSON.stringify({
        type: 'request_start_game'
      }));
    });

    window.addEventListener('beforeunload', () => {
      ws.send(JSON.stringify({ type: 'leave_room' }));
    });
  </script>
</body>
</html>
